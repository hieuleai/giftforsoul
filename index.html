<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Một món quà dành cho bạn</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:#f7f7f7;
  color:#222;
  display:flex;
  justify-content:center;
  align-items:center;
}
.box{
  width:420px;
  max-width:90%;
  background:#fff;
  padding:35px;
  border-radius:14px;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
  text-align:center;
}
.icon{font-size:42px;margin-bottom:15px}
h2{margin:0 0 12px;font-size:22px}
p{color:#666;line-height:1.6;margin:10px 0 22px}
button{
  border:0;
  border-radius:8px;
  padding:12px 24px;
  font-size:16px;
  cursor:pointer;
  background:#222;
  color:#fff;
}
button:hover{opacity:.9}
.hidden{display:none}
.progress{
  height:8px;
  background:#e8e8e8;
  border-radius:10px;
  overflow:hidden;
  margin-top:20px;
}
.bar{
  height:100%;
  width:0;
  background:#222;
  transition:width .1s linear;
}
#loadingText{margin-top:12px;color:#777}
#videoScreen{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}
#videoScreen video{
  width:100vw;
  height:100vh;
  object-fit:contain;
  background:#000;
}
</style>
</head>

<body>

<div class="box" id="step1">
  <div class="icon">💌</div>
  <h2>Bạn khỏe không?</h2>
  <p>Dạo này mọi thứ ổn chứ?</p>
  <button onclick="nextStep(1)">Mình ổn</button>
</div>

<div class="box hidden" id="step2">
  <div class="icon">🌿</div>
  <h2>Nếu hôm nay không ổn cũng không sao.</h2>
  <p>Đôi khi chúng ta chỉ cần một chút thời gian để nghỉ ngơi. Mong rằng mọi chuyện sẽ sớm tốt hơn với bạn.</p>
  <button onclick="nextStep(2)">Cảm ơn nhé</button>
</div>

<div class="box hidden" id="step3">
  <div class="icon">🎁</div>
  <h2>Đây là một món quà dành cho bạn.</h2>
  <p>Hy vọng nó sẽ làm bạn vui một chút.</p>
  <button onclick="startLoading()">Mở quà</button>
</div>

<div class="box hidden" id="loading">
  <div class="icon">🎁</div>
  <h2>Đang chuẩn bị món quà...</h2>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div id="loadingText">0%</div>
</div>

<div id="videoScreen">
  <video id="giftVideo" src="jumpscare.mp4" playsinline preload="auto"></video>
</div>

<script>
function hideAll(){
  document.querySelectorAll('.box').forEach(x=>x.classList.add('hidden'));
}

function nextStep(n){
  hideAll();
  document.getElementById('step'+(n+1)).classList.remove('hidden');
}

function startLoading(){
  hideAll();
  document.getElementById('loading').classList.remove('hidden');

  let progress=0;
  const bar=document.getElementById('bar');
  const text=document.getElementById('loadingText');

  const timer=setInterval(()=>{
    progress++;
    bar.style.width=progress+'%';
    text.textContent=progress+'%';

    if(progress>=100){
      clearInterval(timer);
      setTimeout(playGift,250);
    }
  },35);
}

function playGift(){
  const screen=document.getElementById('videoScreen');
  const video=document.getElementById('giftVideo');

  screen.style.display='flex';
  video.currentTime=0;

  // Người dùng vừa bấm "Mở quà", nên trình duyệt thường cho phép autoplay có tiếng.
  const p=video.play();
  if(p) p.catch(()=>{
    // Nếu trình duyệt vẫn chặn, cho phép bắt đầu bằng một lần chạm.
    video.muted=false;
  });
}
</script>

</body>
</html>
