<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gift for Soul</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#fff;background:#111;
}
.bg{
  position:fixed;inset:0;background-size:cover;background-position:center;
  opacity:0;transform:scale(1.035);
  transition:opacity 1.8s ease,transform 7s ease;z-index:-3;
}
.bg.active{opacity:1;transform:scale(1)}
.shade{
  position:fixed;inset:0;z-index:-2;
  background:linear-gradient(180deg,rgba(0,0,0,.16),rgba(0,0,0,.48));
}
.scene{min-height:100%;display:grid;place-items:center;padding:24px}
.card{
  width:min(680px,92vw);padding:42px 36px;
  border:1px solid rgba(255,255,255,.20);border-radius:28px;
  background:rgba(15,18,28,.38);backdrop-filter:blur(18px) saturate(130%);
  -webkit-backdrop-filter:blur(18px) saturate(130%);
  box-shadow:0 24px 80px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.10);
  text-align:center;animation:cardIn .7s cubic-bezier(.2,.8,.2,1);
}
@keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.975)}to{opacity:1;transform:none}}
.fade{animation:fadeIn .55s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;opacity:.72;margin-bottom:15px}
h1{font-size:clamp(30px,5vw,50px);margin:0 0 14px;letter-spacing:-.03em}
p{margin:0 auto;max-width:550px;font-size:17px;line-height:1.72;color:rgba(255,255,255,.89)}
.quote{margin-top:22px;padding:18px 20px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);font-style:italic}
.author{display:block;margin-top:8px;font-size:12px;opacity:.55;font-style:normal}
.buttons{display:flex;justify-content:center;gap:12px;margin-top:28px}
button{
  min-width:190px;border:1px solid rgba(255,255,255,.26);color:#fff;
  background:rgba(255,255,255,.12);padding:14px 24px;border-radius:999px;
  font-size:16px;cursor:pointer;
  transition:transform .18s ease,filter .18s ease,background .18s ease,box-shadow .18s ease;
}
button:hover{background:rgba(255,255,255,.22);filter:brightness(1.16);transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.20)}
button:active{transform:translateY(1px) scale(.965);filter:brightness(.88)}
.primary{background:rgba(255,255,255,.94);color:#171717;border-color:transparent;font-weight:750}
.primary:hover{background:#fff}
.small{min-width:auto;padding:11px 18px;font-size:14px}
.dots{display:flex;justify-content:center;gap:7px;margin-top:22px}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);transition:.3s}
.dot.active{width:24px;border-radius:8px;background:rgba(255,255,255,.9)}
.hint{margin-top:15px;font-size:12px;opacity:.52}
#loader{display:none}
.progress{height:10px;margin:24px 0 10px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.12)}
.progress>div{width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#fff,#d9e7ff);transition:width .12s linear}
.percent{font-size:13px;opacity:.68}
#scare{display:none;position:fixed;inset:0;z-index:50;background:#000;place-items:center}
#scare video{width:100vw;height:100vh;object-fit:cover;display:block}
.music{
  position:fixed;right:16px;bottom:16px;z-index:10;
  width:40px;height:40px;min-width:40px;padding:0;font-size:17px;
  background:rgba(0,0,0,.22);backdrop-filter:blur(10px);opacity:.75
}
</style>
</head>
<body>
<div class="bg active" id="bg1" style="background-image:url('bg1.jpg')"></div>
<div class="bg" id="bg2" style="background-image:url('bg2.jpg')"></div>
<div class="bg" id="bg3" style="background-image:url('bg3.jpg')"></div>
<div class="shade"></div>

<audio id="music" src="sunset-day.mp3" preload="auto" loop></audio>
<button class="music" id="musicBtn" aria-label="Bật/tắt nhạc">♫</button>

<main class="scene">
  <section class="card" id="card"></section>

  <section class="card" id="loader">
    <div class="eyebrow">Món quà cuối cùng</div>
    <h1>Đang chuẩn bị...</h1>
    <p id="loadText">Mình đang chuẩn bị mọi thứ cho bạn. Chờ một chút nhé.</p>
    <div class="progress"><div id="bar"></div></div>
    <div class="percent" id="percent">0%</div>
    <div class="hint">Video được tải hoàn toàn trước khi món quà xuất hiện.</div>
  </section>
</main>

<div id="scare"><video id="scareVideo" playsinline preload="auto"></video></div>

<script>
const slides=[
 {
  bg:0,
  eyebrow:"Một món quà nhỏ dành cho bạn",
  title:"Dạo này bạn khỏe không?",
  text:"Có những ngày mọi thứ rất nhẹ nhàng, cũng có những ngày chẳng ổn chút nào. Dù hôm nay của bạn thế nào, mong bạn vẫn đối xử với bản thân thật dịu dàng.",
  quote:"“Bạn không cần phải ổn mọi lúc. Nghỉ ngơi cũng là một phần của hành trình.”",
  button:"Tiếp tục →"
 },
 {
  bg:1,
  eyebrow:"Nếu hôm nay hơi mệt",
  title:"Không sao đâu ☁️",
  text:"Bạn không cần phải giả vờ rằng mình luôn mạnh mẽ. Có thể chậm lại một chút, thở sâu một chút, rồi tiếp tục khi bạn đã sẵn sàng.",
  quote:"“Không phải ngày nào cũng cần là một ngày tuyệt vời.”",
  button:"Tiếp tục →"
 },
 {
  bg:2,
  eyebrow:"Nếu hôm nay đang ổn",
  title:"Hãy giữ lấy bình yên ấy 🌿",
  text:"Một ngày bình thường nhưng lòng thấy nhẹ nhõm cũng đã là một điều đáng quý. Mong những điều tốt đẹp sẽ ở lại với bạn lâu hơn một chút.",
  quote:"“Hạnh phúc đôi khi chỉ là nhận ra hôm nay mình đang bình yên.”",
  button:"Nhận món quà 🎁"
 }
];

let slide=0;
const card=document.getElementById("card");
const bgs=[document.getElementById("bg1"),document.getElementById("bg2"),document.getElementById("bg3")];
const music=document.getElementById("music");
const musicBtn=document.getElementById("musicBtn");

function startMusic(){
  music.volume=.20;
  music.play().catch(()=>{});
}
function setBg(i){
  bgs.forEach((b,n)=>b.classList.toggle("active",n===i));
}
function render(){
  const s=slides[slide];
  setBg(s.bg);
  card.classList.remove("fade");
  void card.offsetWidth;
  card.classList.add("fade");
  card.innerHTML=`
    <div class="eyebrow">${s.eyebrow}</div>
    <h1>${s.title}</h1>
    <p>${s.text}</p>
    <div class="quote">${s.quote}<span class="author">— một lời nhắc dành cho bạn</span></div>
    <div class="buttons">
      <button class="primary" id="next">${s.button}</button>
    </div>
    <div class="dots">
      ${slides.map((_,i)=>`<span class="dot ${i===slide?"active":""}"></span>`).join("")}
    </div>
    <div class="hint">Trang ${slide+1} / ${slides.length}</div>
  `;
  document.getElementById("next").onclick=()=>{
    startMusic();
    if(slide<slides.length-1){slide++;render();}
    else startGift();
  };
}
render();

musicBtn.onclick=()=>{
  if(music.paused){startMusic();musicBtn.textContent="♫";}
  else{music.pause();musicBtn.textContent="🔇";}
};

/* Preload the jumpscare early, but the visible loading screen still waits
   for the real video plus a deliberate minimum duration. */
let videoBlobUrl=null, videoReadyPromise=null;
function preloadVideo(){
  videoReadyPromise=(async()=>{
    const r=await fetch("jumpscare.mp4",{cache:"force-cache"});
    if(!r.ok) throw new Error("Video không tải được");
    const blob=await r.blob();
    videoBlobUrl=URL.createObjectURL(blob);
    return videoBlobUrl;
  })();
}
preloadVideo();

async function startGift(){
  card.style.display="none";
  const loader=document.getElementById("loader");
  loader.style.display="block";
  loader.classList.remove("fade"); void loader.offsetWidth; loader.classList.add("fade");

  const bar=document.getElementById("bar");
  const percent=document.getElementById("percent");
  const text=document.getElementById("loadText");
  const video=document.getElementById("scareVideo");

  const minTime=6000;
  const started=performance.now();

  try{
    let progress=0;
    const timer=setInterval(()=>{
      const elapsed=performance.now()-started;
      const timeProgress=Math.min(94,(elapsed/minTime)*94);
      progress=Math.max(progress,timeProgress);
      bar.style.width=progress+"%";
      percent.textContent=Math.floor(progress)+"%";
    },80);

    await videoReadyPromise;

    video.src=videoBlobUrl;
    video.load();

    await new Promise((resolve,reject)=>{
      if(video.readyState>=3) return resolve();
      video.addEventListener("canplaythrough",resolve,{once:true});
      video.addEventListener("error",reject,{once:true});
    });

    const remaining=Math.max(0,minTime-(performance.now()-started));
    await new Promise(r=>setTimeout(r,remaining));

    clearInterval(timer);
    bar.style.width="100%";
    percent.textContent="100%";
    text.textContent="Xong rồi. Đây là món quà dành cho bạn. ✨";

    setTimeout(()=>{
      document.getElementById("scare").style.display="grid";
      video.currentTime=0;
      video.play().catch(()=>{
        text.textContent="Chạm vào màn hình để tiếp tục.";
        document.getElementById("scare").onclick=()=>video.play();
      });
    },900);
  }catch(e){
    console.error(e);
    text.textContent="Có lỗi khi chuẩn bị món quà. Hãy thử tải lại trang.";
    percent.textContent="!";
  }
}
</script>
</body>
</html>
